name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check the bundled Link CLI
        run: node --import tsx scripts/check-link-bundle.ts
      - name: Load the private checkout browser client
        run: node --input-type=module -e "const {chromium} = await import('./.output/server/node_modules/playwright-core/index.mjs'); if (chromium.name() !== 'chromium') throw new Error('Missing checkout client')"
      - name: Initialize the bundled card font engine
        run: node --input-type=module -e "await (await import('./.output/server/node_modules/harfbuzzjs/index.js')).default"
